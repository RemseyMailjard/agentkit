name: AgentKit Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: AgentKit platform quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout AgentKit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Checkout OpenAI plugins
        uses: actions/checkout@v4
        with:
          repository: openai/plugins
          path: .external/openai-plugins

      - name: 1. Structural validation
        run: python scripts/validate_agentkit.py

      - name: 2. Runtime routing smoke tests
        run: |
          python scripts/run_runtime_evals.py \
            --cases "evals/runtime/smoke-cases.json" \
            --runner fixture \
            --fixtures "evals/runtime/fixtures.json" \
            --json-out "evals/runtime/quality-gate-results.json" \
            --markdown-out "evals/runtime/quality-gate-results.md"

      - name: 3. Official Plugin Eval — all plugins
        env:
          OPENAI_PLUGINS_DIR: ${{ github.workspace }}/.external/openai-plugins
        run: |
          mkdir -p evals/plugin-eval/reports
          for plugin in mcp-builder dotnet-reviewer lab-generator training-creator onenote; do
            echo "=== $plugin ==="
            python scripts/run_plugin_eval.py "$plugin" --format markdown \
              | tee "evals/plugin-eval/reports/${plugin}.md"
          done

      - name: 4. Enforce production plugin thresholds
        run: |
          for plugin in mcp-builder dotnet-reviewer lab-generator training-creator; do
            python scripts/check_plugin_eval_report.py \
              "evals/plugin-eval/reports/${plugin}.md" \
              --minimum-score 80 \
              --require-zero-fails
          done

      - name: 5. OneNote scaffold report policy
        run: |
          test -s evals/plugin-eval/reports/onenote.md
          echo "OneNote is evaluated but remains non-blocking while its manifest describes it as a scaffold."

      - name: 6. MCP Builder benchmark asset validation
        run: |
          test -f plugins/mcp-builder/.plugin-eval/benchmark.template.json
          test -f benchmarks/workspaces/mcp-builder-customer-support/openapi.yaml
          test -f benchmarks/workspaces/mcp-builder-customer-support/starter_server.py
          test -f scripts/run_mcp_builder_live_benchmark.py
          python -m compileall -q benchmarks/workspaces/mcp-builder-customer-support

      - name: Quality Gate summary
        if: always()
        run: |
          {
            echo "## AgentKit Platform Quality Gate"
            echo
            echo "| Plugin | Policy |"
            echo "|---|---|"
            echo "| MCP Builder | >= 80, 0 hard fails |"
            echo "| .NET Reviewer | >= 80, 0 hard fails |"
            echo "| Lab Generator | >= 80, 0 hard fails |"
            echo "| Training Creator | >= 80, 0 hard fails |"
            echo "| OneNote | measured, scaffold/non-blocking |"
            echo
            for report in evals/plugin-eval/reports/*.md; do
              [ -f "$report" ] || continue
              plugin=$(basename "$report" .md)
              echo "### $plugin"
              sed -n '/## At a Glance/,/## Why It Matters/p' "$report"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentkit-quality-gate
          path: |
            evals/plugin-eval/reports/
            evals/runtime/quality-gate-results.json
            evals/runtime/quality-gate-results.md
          if-no-files-found: warn
