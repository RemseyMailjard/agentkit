name: MCP Builder Benchmark Prep

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-prep:
    name: Validate MCP Builder benchmark assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AgentKit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate benchmark fixture
        run: |
          test -f plugins/mcp-builder/.plugin-eval/benchmark.template.json
          test -f benchmarks/workspaces/mcp-builder-customer-support/openapi.yaml
          test -f benchmarks/workspaces/mcp-builder-customer-support/starter_server.py
          test -f scripts/run_mcp_builder_live_benchmark.py
          python -m compileall -q benchmarks/workspaces/mcp-builder-customer-support

      - name: Summary
        run: |
          echo "MCP Builder benchmark assets are present and structurally valid." >> "$GITHUB_STEP_SUMMARY"
          echo "Live Codex benchmarking is currently optional and not part of CI." >> "$GITHUB_STEP_SUMMARY"
